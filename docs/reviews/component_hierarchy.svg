<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">

  <rect width="900" height="430" fill="#f0ede6"/>

  <!-- DepartureBoardApp (root) -->
  <rect x="8" y="8" width="884" height="414" rx="10"
