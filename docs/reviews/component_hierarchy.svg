<svg width="1400" height="680" viewBox="0 0 1400 680" xmlns="http://www.w3.org/2000/svg">

  <rect width="1400" height="680" fill="#f0ede6"/>

  <!-- DepartureBoardApp (root) -->
  <rect x="10" y="10" width="1380" height="660" rx="12"
        fill="none" stroke="#7F77DD" stroke-width="4"/>
  <rect x="10" y="10" width="380" height="40" rx="6" fill="#7F77DD"/>
  <text x="22" y="38" font-size="22" fill="white" font-weight="700" font-family="sans-serif">DepartureBoardApp</text>
  <text x="400" y="38" font-size="19" fill="#AFA9EC" font-family="sans-serif">훅[0~6] 전부 보유 · 유일한 상태 소유자</text>

  <!-- ControlPanel (left) -->
  <rect x="24" y="64" width="420" height="420" rx="10"
        fill="none" stroke="#1D9E75" stroke-width="3"/>
  <rect x="24" y="64" width="180" height="38" rx="6" fill="#1D9E75"/>
  <text x="36" y="89" font-size="20" fill="white" font-weight="700" font-family="sans-serif">ControlPanel</text>
  <text x="212" y="89" font-size="18" fill="#5DCAA5" font-family="sans-serif">props 수신 · 훅 없음</text>

  <!-- BoardScreen (right) -->
  <rect x="462" y="64" width="908" height="596" rx="12"
        fill="none" stroke="#378ADD" stroke-width="3"/>
  <rect x="462" y="64" width="172" height="38" rx="6" fill="#378ADD"/>
  <text x="474" y="89" font-size="20" fill="white" font-weight="700" font-family="sans-serif">BoardScreen</text>
  <text x="642" y="89" font-size="18" fill="#85B7EB" font-family="sans-serif">props 수신 · 훅 없음</text>

  <!-- BoardToolbar -->
  <rect x="478" y="114" width="876" height="72" rx="8"
        fill="none" stroke="#BA7517" stroke-width="2.5"/>
  <rect x="478" y="114" width="172" height="36" rx="6" fill="#BA7517"/>
  <text x="490" y="138" font-size="20" fill="white" font-weight="700" font-family="sans-serif">BoardToolbar</text>
  <text x="658" y="138" font-size="18" fill="#FAC775" font-family="sans-serif">props 수신 · 훅 없음</text>

  <!-- DepartureList -->
  <rect x="478" y="200" width="876" height="444" rx="8"
        fill="none" stroke="#D85A30" stroke-width="2.5"/>
  <rect x="478" y="200" width="180" height="36" rx="6" fill="#D85A30"/>
  <text x="490" y="224" font-size="20" fill="white" font-weight="700" font-family="sans-serif">DepartureList</text>
  <text x="666" y="224" font-size="18" fill="#F0997B" font-family="sans-serif">props 수신 · 훅 없음</text>

  <!-- DepartureRow × 4 -->
  <rect x="494" y="248" width="844" height="72" rx="6"
        fill="none" stroke="#993C1D" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="506" y="272" font-size="19" fill="#993C1D" font-weight="700" font-family="sans-serif">DepartureRow</text>
  <text x="670" y="272" font-size="18" fill="#F5C4B3" font-family="sans-serif">useMemo로 상태 계산 · 반복 렌더</text>

  <rect x="494" y="332" width="844" height="72" rx="6"
        fill="none" stroke="#993C1D" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="506" y="356" font-size="19" fill="#993C1D" font-weight="700" font-family="sans-serif">DepartureRow</text>
  <text x="670" y="356" font-size="18" fill="#F5C4B3" font-family="sans-serif">useMemo로 상태 계산 · 반복 렌더</text>

  <rect x="494" y="416" width="844" height="72" rx="6"
        fill="none" stroke="#993C1D" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="506" y="440" font-size="19" fill="#993C1D" font-weight="700" font-family="sans-serif">DepartureRow</text>
  <text x="670" y="440" font-size="18" fill="#F5C4B3" font-family="sans-serif">useMemo로 상태 계산 · 반복 렌더</text>

  <rect x="494" y="500" width="844" height="72" rx="6"
        fill="none" stroke="#993C1D" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="506" y="524" font-size="19" fill="#993C1D" font-weight="700" font-family="sans-serif">DepartureRow</text>
  <text x="670" y="524" font-size="18" fill="#F5C4B3" font-family="sans-serif">useMemo로 상태 계산 · 반복 렌더</text>

</svg>
