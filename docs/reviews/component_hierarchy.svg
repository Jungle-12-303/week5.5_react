  <text x="364" y="254" font-size="9" fill="#993C1D" font-weight="500" font-family="sans-serif">DepartureRow</text>
  <text x="444" y="254" font-size="9" fill="#F5C4B3" font-family="sans-serif">useMemo로 상태 계산 · 반복 렌더</text>

